[global]
listen = "0.0.0.0:7741"
data_dir = "~/.superprojectsyncer"
discovery = true
# log_file = ""          # default: <data_dir>/sps.log
# log_file = "none"      # stderr only, no file

# Relay hub (when both peers are behind NAT — no public IP on either side):
# relay = "75.119.139.223:7750"
# relay_key = "same-secret-as-relay.example.toml"

[[sync]]
name = "sync-example"
local_path = "D:\\tools\\rainmeter"
direction = "bidirectional"
role = "provider"
approval = "auto"
peers = ["192.168.1.50:7741"]
sync_key = "change-me-long-random"
ignore = [
  ".env",
  "**/.env",
  "*.log",
  "node_modules/**",
  "secrets/",
  ".git/**",
]

# Linux example (use on the other machine):
