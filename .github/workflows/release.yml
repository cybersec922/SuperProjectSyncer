name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/sps-windows-amd64.exe ./cmd/sps
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/sps-linux-amd64 ./cmd/sps
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/sps-linux-arm64 ./cmd/sps

          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sps-windows-amd64.exe
            dist/sps-linux-amd64
            dist/sps-linux-arm64
            dist/SHA256SUMS.txt
